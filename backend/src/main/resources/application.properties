spring.application.name=hqms
server.port=8080

# Optional local file for secrets (it is in .gitignore, so it never reaches GitHub)
spring.config.import=optional:classpath:application-local.properties

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/hqms
spring.datasource.username=root

# JPA: Flyway owns the tables, Hibernate only checks them
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true

# MongoDB (not used until Step 14)
spring.mongodb.uri=mongodb://localhost:27017/hqms_logs

# Actuator: expose only health
management.endpoints.web.exposure.include=health
management.health.mongodb.enabled=false